name: 'Setup Environment'
description: 'Sets up Node.js and project dependencies'

inputs:
  node-version:
    description: 'Node.js version'
    required: false
    default: '20.x'

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'

    - name: Match locally validated npm
      shell: bash
      run: npm install --global npm@11.19.0

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Analytics tests
      shell: bash
      run: npm run test:analytics

    - name: Image metadata tests
      shell: bash
      run: npm run test:image-metadata

    - name: Dependency audit
      shell: bash
      run: npm audit

    - name: Type check
      shell: bash
      run: npm run typecheck

    - name: Build
      shell: bash
      run: npm run build

    - name: Validate built site
      shell: bash
      run: npm run validate:site
